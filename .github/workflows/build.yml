name: Build and Deploy to Sandbox

on:
  push:
    branches: [ release-1125 ]
  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
    
    steps:
    
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: Debug - Java version
      run: java -version
    
    - name: Debug - Maven version
      run: mvn --version
    
    - name: Resolve dependencies
      run: mvn dependency:resolve -s .maven/settings.xml
    
    - name: Build and package
      run: mvn clean package -s .maven/settings.xml -DskipTests
    
    - name: Deploy to CloudHub
      run: |
        mvn mule:deploy \
          -s .maven/settings.xml \
          -DskipTests \
          -DskipExchangeDeployment=true \
          -DskipDeploymentVerification="true"
