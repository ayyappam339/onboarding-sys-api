name: Build and Deploy to Sandbox

on:
  push:
    branches: [ release-1125 ]
  pull_request:
    branches: [ release-1125 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      # ✅ Create Maven settings.xml with Anypoint credentials
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>Exchange2</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>anypoint-exchange</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>Repository</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
            </servers>

            <pluginGroups>
              <pluginGroup>org.mule.tools</pluginGroup>
            </pluginGroups>

            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>

              <profile>
                <id>Mule</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>MuleRepository</id>
                    <url>https://repository.mulesoft.org/nexus-ee/content/repositories/releases-ee/</url>
                    <layout>default</layout>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>MuleRepositoryPublic</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                    <layout>default</layout>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipMunitTests

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/.jar/-$commitHash.jar/")
          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - uses: actions/download-artifact@v4
        with:
          name: artifacts

      # ✅ Configure Maven settings again for deploy
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>Exchange2</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>anypoint-exchange</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
              <server>
                <id>Repository</id>
                <username>${{ secrets.anypoint_platform_username }}</username>
                <password>${{ secrets.anypoint_platform_password }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Sandbox
        env:
          USERNAME: ${{ secrets.anypoint_platform_username }}
          PASSWORD: ${{ secrets.anypoint_platform_password }}
          KEY: ${{ secrets.decryption_key }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DskipMunitTests -DmuleDeploy \
            -Dmule.artifact="$artifactName" \
            -Danypoint.username="$USERNAME" \
            -Danypoint.password="$PASSWORD" \
            -Ddecryption.key="$KEY"
