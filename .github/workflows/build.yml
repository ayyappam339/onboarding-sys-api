name: Build and Deploy to Sandbox

on:
  push:
    branches: [ release-1125 ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Create Maven settings.xml
        run: |
          mkdir -p .maven
          cat > .maven/settings.xml <<EOF
          <settings>
              <servers>
          
                  <!-- Exchange v2 -->
                  <server>
                    <id>anypoint-exchange-v2</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <!-- Exchange v3 -->
                  <server>
                    <id>anypoint-exchange-v3</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <!-- Your Org Repo (distributionManagement) -->
                  <server>
                    <id>ca.anypoint.credentials</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

              </servers>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B package -s .maven/settings.xml

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/.jar/-$commitHash.jar/g")
          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar


  upload:
    needs: build
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Create Maven settings.xml
        run: |
          mkdir -p .maven
          cat > .maven/settings.xml <<EOF
          <settings>
              <servers>

                  <server>
                    <id>anypoint-exchange-v2</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <server>
                    <id>anypoint-exchange-v3</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <server>
                    <id>ca.anypoint.credentials</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

              </servers>
          </settings>
          EOF

      - name: Upload to Exchange (Maven deploy)
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy \
            -s .maven/settings.xml \
            -Dmule.artifact=$artifactName


  deploy:
    needs: upload
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Create Maven settings.xml
        run: |
          mkdir -p .maven
          cat > .maven/settings.xml <<EOF
          <settings>
              <servers>

                  <server>
                    <id>anypoint-exchange-v2</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <server>
                    <id>anypoint-exchange-v3</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

                  <server>
                    <id>ca.anypoint.credentials</id>
                    <username>${env.CA_CLIENT_ID}</username>
                    <password>${env.CA_CLIENT_SECRET}</password>
                  </server>

              </servers>
          </settings>
          EOF

      - name: Deploy to CloudHub Sandbox
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=$artifactName \
            -s .maven/settings.xml \
            -DskipTests \
            -DskipDeploymentVerification="true"
