name: Build and Deploy to Sandbox

on:
  push:
    branches: [ release-1125 ]
  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
      CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
    
    steps:
    
    - uses: actions/checkout@v3
    
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: 11
        distribution: 'zulu'
    
    - name: Print effective-settings
      run: mvn help:effective-settings -s .maven/settings.xml
    
    - name: Build with Maven
      run: mvn -B package -s .maven/settings.xml
    
    - name: Upload to Exchange
      run: |
        mvn deploy -s .maven/settings.xml -DskipTests
    
    - name: Deploy to CloudHub
      run: |
        mvn mule:deploy -s .maven/settings.xml -DskipTests -DskipDeploymentVerification="true"
