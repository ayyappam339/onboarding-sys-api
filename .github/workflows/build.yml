name: Build and Deploy to Sandbox

on:
  push:
    branches: [ release-1125 ]
  pull_request:
    branches: [ release-1125 ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      USERNAME: ${{ secrets.anypoint_platform_username }}
      PASSWORD: ${{ secrets.anypoint_platform_password }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17
          cache: maven

      - name: Build Mule application
        run: mvn clean package -B -DskipMunitTests

      - name: Stamp artifact with commit hash
        run: |
          artifact=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short HEAD)
          newArtifact=$(echo $artifact | sed "s/.jar/-$commitHash.jar/")
          mv $artifact $newArtifact
          echo "artifact=$newArtifact" >> $GITHUB_ENV

      - name: Deploy to CloudHub
        run: mvn mule:deploy -B -DskipMunitTests -Dmule.artifact=$artifact
